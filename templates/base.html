
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}My Application{% endblock %}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(
                -45deg, #0f172a, #172554, #312e81, #1e3a8a
            );
            background-size: 400% 400%;
            animation: gradient 12s ease infinite;
            padding: 25px;
            overflow-x: hidden;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .circle {
            position: fixed;
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.25;
            animation: float 8s ease-in-out infinite;
            pointer-events: none;
        }

        .circle.one {
            width: 220px;
            height: 220px;
            background: #60a5fa;
            top: 5%;
            left: 8%;
        }

        .circle.two {
            width: 180px;
            height: 180px;
            background: #c084fc;
            bottom: 5%;
            right: 8%;
            animation-delay: 2s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-35px); }
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 460px;
            padding: 38px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 22px;
            background: rgba(255,255,255,0.10);
            backdrop-filter: blur(18px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            color: white;
            animation: appear 0.8s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 30px;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
            color: #e2e8f0;
        }

        input, select {
            width: 100%;
            padding: 13px 14px;
            border-radius: 9px;
            border: 1px solid rgba(255,255,255,0.2);
            outline: none;
            background: rgba(255,255,255,0.09);
            color: white;
            font-size: 14px;
            transition: 0.3s;
        }

        input::placeholder {
            color: #a5b4c9;
        }

        select option {
            color: #111827;
            background: white;
        }

        input:focus, select:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96,165,250,0.2);
        }

        .password-box {
            position: relative;
        }

        .toggle {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 12px;
            color: #93c5fd;
        }

        .strength {
            height: 5px;
            width: 100%;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            margin-top: 9px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: 0.3s;
            border-radius: 10px;
        }

        .hint {
            font-size: 11px;
            color: #cbd5e1;
            margin-top: 6px;
        }

        .message {
            display: none;
            padding: 11px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            text-align: center;
        }

        .error {
            background: rgba(239,68,68,0.2);
            color: #fecaca;
        }

        .success {
            background: rgba(34,197,94,0.2);
            color: #bbf7d0;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(90deg, #3b82f6, #6366f1);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(59,130,246,0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #cbd5e1;
        }

        @media(max-width: 500px) {
            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

    <div class="circle one"></div>
    <div class="circle two"></div>

    {% block content %}
    {% endblock %}

    <script>
        // Common JavaScript can go here.
    </script>

    {% block extra_js %}{% endblock %}

</body>
</html>
